version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: civicconnect_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    container_name: civicconnect_ai
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: civicconnect_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/civicconnect
      - JWT_SECRET=supersecretjwtkey_for_docker
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
      - ai-service
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: civicconnect_client
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
