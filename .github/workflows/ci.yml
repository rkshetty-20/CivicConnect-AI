name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint || echo "No lint script"
      - name: Run tests
        run: npm test || echo "No test script"
      - name: Build production bundle
        run: npm run build
      - name: Upload artifact (client build)
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ./dist

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint || echo "No lint script"
      - name: Run tests
        run: npm test || echo "No test script"
      - name: Build Docker image
        run: docker build -t civicconnect-server:latest .

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest || echo "No tests defined"
      - name: Build Docker image
        run: docker build -t civicconnect-ai-service:latest .

  docker-compose:
    runs-on: ubuntu-latest
    needs: [client, server, ai-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Compose
        run: |
          sudo apt-get update && sudo apt-get install -y docker-compose
      - name: Validate compose file
        run: docker compose config -q
      - name: Bring up services (dry run)
        env:
          COMPOSE_IGNORE_ORPHANS: 'true'
        run: |
          docker compose up -d --no-start
          docker compose ps
          docker compose down

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-compose]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push server image
        run: |
          docker tag civicconnect-server:latest ghcr.io/${{ github.repository_owner }}/civicconnect-server:latest
          docker push ghcr.io/${{ github.repository_owner }}/civicconnect-server:latest
      - name: Push AI service image
        run: |
          docker tag civicconnect-ai-service:latest ghcr.io/${{ github.repository_owner }}/civicconnect-ai-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/civicconnect-ai-service:latest
